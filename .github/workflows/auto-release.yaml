name: Auto-release module changes

on:
  push:
    branches: [main]
    paths:
      - "modules/**"

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  validate:
    name: Validate terraform configuration
    # Required checks are not strict, so a PR merged on a stale base can break
    # main; re-check before publishing a release from it.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform validate
        uses: dflook/terraform-validate@v2

      - name: Terraform fmt check
        uses: dflook/terraform-fmt-check@v2

  release:
    name: Tag release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plan release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/plan-release.sh

      - name: Create release
        if: steps.plan.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "${{ github.sha }}" \
            --title "$VERSION" \
            --notes-file release-notes.md
